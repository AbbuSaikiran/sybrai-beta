<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="description" content="SYBRAI — AI Bug Fixer & Analyzer. Describe. Analyze. Fix. Learn. Improve." />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SYBRAI" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>SYBRAI — AI Bug Fixer & Analyzer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/reset.css" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/screens.css" />
</head>
<body>
  <!-- Accessibility: Skip to main content -->
  <a href="#main-content" class="sr-only sr-only--focusable">Skip to main content</a>

  <!-- App Shell -->
  <div id="app" class="app-shell">
    <!-- Status Bar (simulated mobile) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons">
        <i data-lucide="signal" class="status-bar__icon"></i>
        <i data-lucide="wifi" class="status-bar__icon"></i>
        <i data-lucide="battery-full" class="status-bar__icon"></i>
      </div>
    </div>

    <!-- Screen Container -->
    <main id="main-content" class="screen-container" role="main">
      <!-- Screens rendered here by router -->
    </main>

    <!-- Bottom Tab Bar (hidden on splash/auth) -->
    <nav id="bottom-tab-bar" class="bottom-tab-bar" role="navigation" aria-label="Main navigation" style="display:none;">
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-container"></div>

  <script type="module" src="/src/main.js"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
